site_name: Docs as Code

theme:
  name: readthedocs

plugins:
  - search

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid-init.js

nav:
  - Главная: index.md
  - Проект:
      - Описание: project/overview.md
      - Требования: project/requirements.md
      - Диаграммы: project/diagrams.md
  - API: api/index.md
  - ML:
      - Model Card: ml/model-card.md
      - Data Sheet: ml/dataset.md
      - Риски: ml/risks.md